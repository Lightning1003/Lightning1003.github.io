<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>墨水屏布局编辑器 v2.2 (修复保存)</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Microsoft YaHei', sans-serif; background:#1a1a2e; color:#eee; height:100vh; display:flex; flex-direction:column; }
.toolbar { background:#16213e; padding:8px 16px; display:flex; gap:8px; align-items:center; border-bottom:1px solid #0f3460; flex-shrink:0; }
.toolbar button { background:#0f3460; color:#fff; border:1px solid #e94560; padding:6px 14px; border-radius:4px; cursor:pointer; font-size:13px; }
.toolbar button:hover { background:#e94560; }
.toolbar .sep { width:1px; height:24px; background:#0f3460; margin:0 4px; }
.toolbar label { font-size:12px; color:#aaa; }
.toolbar select { background:#0f3460; color:#fff; border:1px solid #e94560; padding:3px 8px; border-radius:3px; font-size:12px; }
.main { display:flex; flex:1; overflow:hidden; }
.canvas-panel { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#0a0a1a; overflow:auto; }
.canvas-wrap { position:relative; }
canvas#epd { background:#000; image-rendering:pixelated; box-shadow:0 0 20px rgba(0,255,0,0.1); }
.props-panel { width:320px; background:#16213e; border-left:1px solid #0f3460; padding:12px; overflow-y:auto; flex-shrink:0; }
.props-panel h3 { color:#e94560; margin-bottom:10px; font-size:14px; }
.prop-row { margin-bottom:10px; }
.prop-row label { display:block; font-size:11px; color:#aaa; margin-bottom:3px; }
.prop-row input, .prop-row select, .prop-row textarea { width:100%; background:#0f3460; color:#fff; border:1px solid #333; padding:5px 8px; border-radius:3px; font-size:12px; font-family:monospace; }
.prop-row textarea { resize:vertical; min-height:50px; }
.prop-row .hint { font-size:10px; color:#666; margin-top:2px; }
.element-list { width:200px; background:#0a0a1a; border-right:1px solid #0f3460; padding:8px; overflow-y:auto; flex-shrink:0; }
.element-list h3 { color:#e94560; margin-bottom:8px; font-size:13px; }
.el-item { padding:6px 8px; margin-bottom:4px; background:#16213e; border-radius:3px; cursor:pointer; font-size:11px; display:flex; justify-content:space-between; align-items:center; }
.el-item:hover { background:#0f3460; }
.el-item.selected { background:#e94560; color:#fff; }
.el-item .el-del { background:#900; color:#fff; border:none; padding:1px 5px; border-radius:2px; cursor:pointer; font-size:10px; }
.el-item .el-del:hover { background:#f00; }
.code-panel { height:200px; background:#0a0a1a; border-top:1px solid #0f3460; display:flex; flex-direction:column; }
.code-panel h3 { color:#e94560; padding:8px 16px 4px; font-size:13px; flex-shrink:0; }
.code-panel pre { flex:1; overflow:auto; padding:8px 16px; font-size:11px; color:#0f0; background:#000; margin:0; white-space:pre-wrap; word-break:break-all; }
.var-row { display:flex; gap:4px; margin-bottom:4px; align-items:center; }
.var-row input { flex:1; }
.var-row .var-del { background:#900; color:#fff; border:none; padding:2px 6px; border-radius:2px; cursor:pointer; font-size:10px; flex-shrink:0; }
.var-row .var-del:hover { background:#f00; }
.add-var-btn { background:#0a4; color:#fff; border:1px solid #0c6; padding:3px 8px; border-radius:3px; cursor:pointer; font-size:10px; margin-top:4px; }
.add-var-btn:hover { background:#0c6; }
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="addText()">+ 文字</button>
  <button onclick="addRect()">+ 矩形</button>
  <button onclick="addLine()">+ 线条</button>
  <span class="sep"></span>
  <label>网格:</label>
  <select id="gridSize" onchange="drawCanvas()">
    <option value="1">1px</option>
    <option value="2">2px</option>
    <option value="4" selected>4px</option>
    <option value="8">8px</option>
  </select>
  <span class="sep"></span>
  <button onclick="generateCode()">生成代码</button>
  <button onclick="saveJSON()">保存JSON</button>
  <button onclick="loadJSON()">加载JSON</button>
  <button onclick="clearAll()">清空</button>
</div>

<div class="main">
  <div class="element-list">
    <h3>元素列表</h3>
    <div id="elList"></div>
  </div>
  <div class="canvas-panel">
    <div class="canvas-wrap">
      <canvas id="epd" width="296" height="128"></canvas>
    </div>
  </div>
  <div class="props-panel">
    <h3>属性</h3>
    <div id="propsArea"><p style="color:#666;font-size:12px;">点击画布上的元素或"+"添加新元素</p></div>
  </div>
</div>

<div class="code-panel">
  <h3>生成代码</h3>
  <pre id="codeOut"></pre>
</div>

<script>
// ============================================================
// 字体 Glyph 数据
// ============================================================
const FONT16_GLYPHS = [
  {w:1,h:1,xAdv:6,xOff:0,yOff:0},{w:2,h:12,xAdv:7,xOff:2,yOff:-12},{w:5,h:4,xAdv:7,xOff:1,yOff:-12},
  {w:12,h:11,xAdv:14,xOff:1,yOff:-11},{w:8,h:14,xAdv:11,xOff:2,yOff:-12},{w:14,h:12,xAdv:16,xOff:1,yOff:-12},
  {w:12,h:12,xAdv:13,xOff:1,yOff:-12},{w:2,h:4,xAdv:4,xOff:1,yOff:-12},{w:5,h:14,xAdv:7,xOff:1,yOff:-12},
  {w:5,h:14,xAdv:7,xOff:1,yOff:-12},{w:8,h:8,xAdv:9,xOff:1,yOff:-12},{w:10,h:9,xAdv:14,xOff:2,yOff:-9},
  {w:3,h:4,xAdv:6,xOff:1,yOff:-2},{w:5,h:1,xAdv:7,xOff:1,yOff:-5},{w:2,h:2,xAdv:6,xOff:2,yOff:-2},
  {w:6,h:13,xAdv:6,xOff:0,yOff:-12},{w:9,h:12,xAdv:11,xOff:1,yOff:-12},{w:8,h:12,xAdv:11,xOff:2,yOff:-12},
  {w:9,h:12,xAdv:11,xOff:1,yOff:-12},{w:10,h:12,xAdv:11,xOff:1,yOff:-12},{w:9,h:12,xAdv:11,xOff:1,yOff:-12},
  {w:9,h:12,xAdv:11,xOff:1,yOff:-12},{w:9,h:12,xAdv:11,xOff:1,yOff:-12},{w:9,h:12,xAdv:11,xOff:1,yOff:-12},
  {w:9,h:12,xAdv:11,xOff:1,yOff:-12},{w:9,h:12,xAdv:11,xOff:1,yOff:-12},{w:2,h:8,xAdv:6,xOff:2,yOff:-8},
  {w:3,h:10,xAdv:6,xOff:1,yOff:-8},{w:11,h:9,xAdv:14,xOff:2,yOff:-9},{w:11,h:4,xAdv:14,xOff:2,yOff:-7},
  {w:11,h:9,xAdv:14,xOff:2,yOff:-9},{w:7,h:12,xAdv:10,xOff:1,yOff:-12},{w:15,h:14,xAdv:17,xOff:1,yOff:-12},
  {w:12,h:12,xAdv:12,xOff:0,yOff:-12},{w:10,h:12,xAdv:12,xOff:1,yOff:-12},{w:10,h:12,xAdv:12,xOff:1,yOff:-12},
  {w:11,h:12,xAdv:13,xOff:1,yOff:-12},{w:9,h:12,xAdv:11,xOff:1,yOff:-12},{w:8,h:12,xAdv:10,xOff:1,yOff:-12},
  {w:11,h:12,xAdv:13,xOff:1,yOff:-12},{w:11,h:12,xAdv:13,xOff:1,yOff:-12},{w:2,h:12,xAdv:6,xOff:2,yOff:-12},
  {w:4,h:15,xAdv:6,xOff:0,yOff:-12},{w:10,h:12,xAdv:11,xOff:1,yOff:-12},{w:8,h:12,xAdv:10,xOff:1,yOff:-12},
  {w:12,h:12,xAdv:14,xOff:1,yOff:-12},{w:11,h:12,xAdv:13,xOff:1,yOff:-12},{w:11,h:12,xAdv:13,xOff:1,yOff:-12},
  {w:12,h:12,xAdv:14,xOff:1,yOff:-12},{w:10,h:12,xAdv:12,xOff:1,yOff:-12},{w:9,h:12,xAdv:11,xOff:1,yOff:-12},
  {w:10,h:12,xAdv:10,xOff:0,yOff:-12},{w:9,h:12,xAdv:11,xOff:1,yOff:-12},{w:14,h:9,xAdv:16,xOff:1,yOff:-9},
  {w:9,h:9,xAdv:11,xOff:1,yOff:-9},{w:9,h:9,xAdv:11,xOff:1,yOff:-9},{w:9,h:12,xAdv:11,xOff:1,yOff:-9},
  {w:9,h:12,xAdv:11,xOff:1,yOff:-9},{w:9,h:12,xAdv:11,xOff:1,yOff:-9},{w:6,h:9,xAdv:8,xOff:1,yOff:-9},
  {w:8,h:9,xAdv:10,xOff:1,yOff:-9},{w:6,h:11,xAdv:7,xOff:0,yOff:-11},{w:9,h:9,xAdv:11,xOff:1,yOff:-9},
  {w:11,h:9,xAdv:10,xOff:0,yOff:-9},{w:14,h:9,xAdv:14,xOff:0,yOff:-9},{w:9,h:9,xAdv:11,xOff:1,yOff:-9},
  {w:9,h:9,xAdv:11,xOff:1,yOff:-9},{w:10,h:12,xAdv:10,xOff:0,yOff:-9},{w:9,h:12,xAdv:10,xOff:1,yOff:-12},
  {w:6,h:15,xAdv:11,xOff:2,yOff:-12},{w:9,h:12,xAdv:10,xOff:1,yOff:-12},{w:14,h:9,xAdv:16,xOff:1,yOff:-9},
  {w:9,h:9,xAdv:11,xOff:1,yOff:-9},{w:9,h:9,xAdv:11,xOff:1,yOff:-9},{w:8,h:9,xAdv:10,xOff:1,yOff:-9},
  {w:6,h:16,xAdv:6,xOff:2,yOff:-12}
];

const FONT16ZH_GLYPHS = [];
for(let i=0;i<41;i++) FONT16ZH_GLYPHS.push({w:16,h:16,xAdv:18,xOff:16,yOff:-16});

const DSEG14_GLYPHS = [];
for(let i=0;i<95;i++) {
  if(i===0) DSEG14_GLYPHS.push({w:1,h:1,xAdv:9,xOff:0,yOff:0});
  else if(i>=1&&i<=26) DSEG14_GLYPHS.push({w:26,h:40,xAdv:34,xOff:4,yOff:-40});
  else if(i>=27&&i<=36) DSEG14_GLYPHS.push({w:26,h:40,xAdv:34,xOff:4,yOff:-40});
  else if(i===37) DSEG14_GLYPHS.push({w:5,h:21,xAdv:9,xOff:2,yOff:-30});
  else DSEG14_GLYPHS.push({w:11,h:26,xAdv:16,xOff:1,yOff:-26});
}

const FONT30_GLYPHS = [];
for(let i=0;i<95;i++) {
  if(i===0) FONT30_GLYPHS.push({w:1,h:1,xAdv:10,xOff:0,yOff:0});
  else if(i>=1&&i<=26) FONT30_GLYPHS.push({w:18,h:21,xAdv:18,xOff:0,yOff:-21});
  else if(i>=27&&i<=36) FONT30_GLYPHS.push({w:16,h:22,xAdv:19,xOff:2,yOff:-22});
  else FONT30_GLYPHS.push({w:14,h:16,xAdv:17,xOff:1,yOff:-16});
}

function getGlyph(ch, font) {
  const code = ch.charCodeAt(0);
  if(code < 0x20 || code > 0x7E) return null;
  const idx = code - 0x20;
  if(font==='Dialog_plain_16') return FONT16_GLYPHS[idx] || null;
  if(font==='Dialog_plain_16_zh') return FONT16ZH_GLYPHS[idx] || null;
  if(font==='DSEG14_Classic_Mini_Regular_40') return DSEG14_GLYPHS[idx] || null;
  if(font==='Special_Elite_Regular_30') return FONT30_GLYPHS[idx] || null;
  return null;
}

// ============================================================
// 状态
// ============================================================
let elements = [];
let nextId = 1;
let selectedId = null;
let dragEl = null;
let dragOffX = 0, dragOffY = 0;

// ============================================================
// 添加元素
// ============================================================
function addText() {
  const el = {
    id: nextId++,
    type: 'text',
    text: '',
    variables: [],
    preview: '',
    font: 'Dialog_plain_16',
    x: 10,
    y: 20,
    color: 1
  };
  elements.push(el);
  selectedId = el.id;
  drawCanvas();
  renderProps();
  renderList();
}

function addRect() {
  const el = { id: nextId++, type: 'rect', x: 10, y: 10, w: 80, h: 20, filled: 0, color: 1 };
  elements.push(el);
  selectedId = el.id;
  drawCanvas(); renderProps(); renderList();
}

function addLine() {
  const el = { id: nextId++, type: 'line', x1: 10, y1: 10, x2: 100, y2: 10, color: 1 };
  elements.push(el);
  selectedId = el.id;
  drawCanvas(); renderProps(); renderList();
}

function delElement(id) {
  elements = elements.filter(e => e.id !== id);
  if(selectedId === id) selectedId = null;
  drawCanvas(); renderProps(); renderList();
}

function clearAll() {
  if(!confirm('确定清空所有元素？')) return;
  elements = []; selectedId = null;
  drawCanvas(); renderProps(); renderList(); generateCode();
}

// ============================================================
// 画布渲染
// ============================================================
const canvas = document.getElementById('epd');
const ctx = canvas.getContext('2d');

function drawCanvas() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, 296, 128);

  const gridSize = parseInt(document.getElementById('gridSize').value);
  ctx.strokeStyle = 'rgba(0,80,0,0.3)';
  ctx.lineWidth = 0.5;
  for(let x=0; x<=296; x+=gridSize) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,128); ctx.stroke(); }
  for(let y=0; y<=128; y+=gridSize) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(296,y); ctx.stroke(); }

  for(const el of elements) {
    if(el.type === 'text') drawTextEl(el);
    else if(el.type === 'rect') drawRectEl(el);
    else if(el.type === 'line') drawLineEl(el);
  }
}

function drawTextEl(el) {
  const baselineY = el.y;
  const text = el.preview || el.text || ' ';
  let curX = el.x;
  let minTop = baselineY, maxBottom = baselineY;
  let totalW = 0;
  const chars = [];

  for(let i=0; i<text.length; i++) {
    const ch = text[i];
    let g = getGlyph(ch, el.font);
    if(!g) g = {w:16,h:16,xAdv:18,xOff:0,yOff:-16};
    chars.push({ch, g, x: curX});
    const charTop = baselineY + g.yOff;
    minTop = Math.min(minTop, charTop);
    maxBottom = Math.max(maxBottom, charTop + g.h);
    totalW += g.xAdv;
    curX += g.xAdv;
  }

  const boxTop = minTop;
  const boxH = maxBottom - minTop;

  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(el.x, boxTop, totalW, boxH);
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.strokeRect(el.x, boxTop, totalW, boxH);

  if(el.font === 'DSEG14_Classic_Mini_Regular_40') {
    const segW = totalW / 5;
    ctx.strokeStyle = '#0cf';
    ctx.lineWidth = 1;
    for(let i=0; i<4; i++) {
      ctx.strokeRect(el.x + i*segW + 2, boxTop + 2, segW - 4, boxH - 4);
    }
    ctx.fillStyle = '#0cf';
    ctx.fillRect(el.x + 4*segW + 2, boxTop + boxH*0.3, 3, 3);
    ctx.fillRect(el.x + 4*segW + 2, boxTop + boxH*0.6, 3, 3);
  } else {
    ctx.fillStyle = '#fff';
    ctx.font = '10px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    for(const {ch, g, x} of chars) {
      ctx.fillText(ch, x + g.xOff, baselineY);
    }
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  if(selectedId === el.id) {
    ctx.strokeStyle = 'red';
    ctx.lineWidth = 1;
    ctx.setLineDash([3,3]);
    ctx.strokeRect(el.x, boxTop, totalW, boxH);
    ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(255,0,0,0.6)';
    ctx.beginPath();
    ctx.moveTo(el.x, baselineY);
    ctx.lineTo(el.x + totalW, baselineY);
    ctx.stroke();
  }
}

function drawRectEl(el) {
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
  if(el.filled) { ctx.fillStyle = '#fff'; ctx.fillRect(el.x, el.y, el.w, el.h); }
  else ctx.strokeRect(el.x, el.y, el.w, el.h);
  if(selectedId === el.id) { ctx.strokeStyle='red'; ctx.setLineDash([3,3]); ctx.strokeRect(el.x,el.y,el.w,el.h); ctx.setLineDash([]); }
}

function drawLineEl(el) {
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(el.x1, el.y1); ctx.lineTo(el.x2, el.y2); ctx.stroke();
  if(selectedId === el.id) { ctx.strokeStyle='red'; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(el.x1,el.y1); ctx.lineTo(el.x2,el.y2); ctx.stroke(); ctx.setLineDash([]); }
}

// ============================================================
// 鼠标交互
// ============================================================
canvas.addEventListener('mousedown', function(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;
  for(let i=elements.length-1; i>=0; i--) {
    const el = elements[i];
    if(hitTest(el, mx, my)) {
      selectedId = el.id;
      dragEl = el;
      dragOffX = mx - (el.x || el.x1);
      dragOffY = my - (el.y || el.y1);
      renderProps(); renderList(); drawCanvas();
      return;
    }
  }
  selectedId = null;
  renderProps(); renderList(); drawCanvas();
});

canvas.addEventListener('mousemove', function(e) {
  if(!dragEl) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;
  const gridSize = parseInt(document.getElementById('gridSize').value);
  let newX = Math.round((mx - dragOffX) / gridSize) * gridSize;
  let newY = Math.round((my - dragOffY) / gridSize) * gridSize;
  newX = Math.max(0, Math.min(296 - 10, newX));
  newY = Math.max(0, Math.min(128 - 10, newY));
  if(dragEl.type === 'text') { dragEl.x = newX; dragEl.y = newY; }
  else if(dragEl.type === 'rect') { dragEl.x = newX; dragEl.y = newY; }
  else if(dragEl.type === 'line') { dragEl.x1 = newX; dragEl.y1 = newY; dragEl.x2 = newX + 50; dragEl.y2 = newY; }
  drawCanvas(); renderProps();
});

canvas.addEventListener('mouseup', function() { dragEl = null; });
canvas.addEventListener('mouseleave', function() { dragEl = null; });

function hitTest(el, mx, my) {
  if(el.type === 'text') {
    const text = el.preview || el.text || ' ';
    let totalW = 0;
    for(let i=0; i<text.length; i++) { const g = getGlyph(text[i], el.font) || {w:16,h:16,xAdv:18,xOff:0,yOff:-16}; totalW += g.xAdv; }
    return mx >= el.x && mx <= el.x + totalW && my >= el.y - 16 && my <= el.y + 4;
  } else if(el.type === 'rect') {
    return mx >= el.x && mx <= el.x + el.w && my >= el.y && my <= el.y + el.h;
  } else if(el.type === 'line') {
    return Math.min(el.x1, el.x2) <= mx && mx <= Math.max(el.x1, el.x2) && Math.min(el.y1, el.y2) <= my && my <= Math.max(el.y1, el.y2);
  }
  return false;
}

// ============================================================
// 属性面板 —— 关键修复：所有修改通过 selectedId 实时查 elements
// ============================================================
function renderProps() {
  const area = document.getElementById('propsArea');
  const el = elements.find(e => e.id === selectedId);
  if(!el) { area.innerHTML = '<p style="color:#666;font-size:12px;">点击画布上的元素或"+"添加新元素</p>'; return; }

  if(el.type === 'text') {
    let varsHtml = '';
    for(let i=0; i<el.variables.length; i++) {
      varsHtml += `<div class="var-row">
        <input value="${escHtml(el.variables[i])}" onchange="setVar(${i}, this.value)" placeholder="C表达式">
        <button class="var-del" onclick="removeVar(${i})">×</button>
      </div>`;
    }

    area.innerHTML = `
      <div class="prop-row">
        <label>格式串（生成代码用）:</label>
        <input id="fld_text" value="${escHtml(el.text)}" onchange="setProp('text', this.value)" placeholder="如: S24_%02X%02X%02X BW213">
      </div>
      <div class="prop-row">
        <label>变量绑定（按顺序）:</label>
        ${varsHtml}
        <button class="add-var-btn" onclick="pushVar()">+ 添加变量</button>
      </div>
      <div class="prop-row">
        <label>预览文字（画布显示，生成时忽略）:</label>
        <input id="fld_preview" value="${escHtml(el.preview)}" onchange="setProp('preview', this.value)" placeholder="如: S24_94EA67">
      </div>
      <div class="prop-row">
        <label>字体:</label>
        <select onchange="setProp('font', this.value)">
          <option value="Dialog_plain_16" ${el.font==='Dialog_plain_16'?'selected':''}>Dialog_plain_16</option>
          <option value="Dialog_plain_16_zh" ${el.font==='Dialog_plain_16_zh'?'selected':''}>Dialog_plain_16_zh</option>
          <option value="DSEG14_Classic_Mini_Regular_40" ${el.font==='DSEG14_Classic_Mini_Regular_40'?'selected':''}>DSEG14 数码管</option>
          <option value="Special_Elite_Regular_30" ${el.font==='Special_Elite_Regular_30'?'selected':''}>Special_Elite</option>
        </select>
      </div>
      <div class="prop-row">
        <label>X / Y (基线):</label>
        <div style="display:flex;gap:4px;">
          <input type="number" value="${el.x}" onchange="setProp('x', +this.value)" style="width:60px;">
          <input type="number" value="${el.y}" onchange="setProp('y', +this.value)" style="width:60px;">
        </div>
      </div>
      <div class="prop-row">
        <label>颜色:</label>
        <select onchange="setProp('color', +this.value)">
          <option value="1" ${el.color===1?'selected':''}>白底黑字</option>
          <option value="0" ${el.color===0?'selected':''}>黑底白字</option>
        </select>
      </div>
      <button onclick="delElement(${el.id})" style="background:#900;color:#fff;border:none;padding:4px 12px;border-radius:3px;cursor:pointer;margin-top:8px;">删除此元素</button>
    `;
  } else if(el.type === 'rect') {
    area.innerHTML = `
      <div class="prop-row"><label>X</label><input type="number" value="${el.x}" onchange="setProp('x',+this.value)"></div>
      <div class="prop-row"><label>Y</label><input type="number" value="${el.y}" onchange="setProp('y',+this.value)"></div>
      <div class="prop-row"><label>宽</label><input type="number" value="${el.w}" onchange="setProp('w',+this.value)"></div>
      <div class="prop-row"><label>高</label><input type="number" value="${el.h}" onchange="setProp('h',+this.value)"></div>
      <div class="prop-row"><label>填充</label><select onchange="setProp('filled',+this.value)"><option value="0" ${!el.filled?'selected':''}>空心</option><option value="1" ${el.filled?'selected':''}>实心</option></select></div>
      <div class="prop-row"><label>颜色</label><select onchange="setProp('color',+this.value)"><option value="1" ${el.color===1?'selected':''}>白</option><option value="0" ${el.color===0?'selected':''}>黑</option></select></div>
      <button onclick="delElement(${el.id})" style="background:#900;color:#fff;border:none;padding:4px 12px;border-radius:3px;cursor:pointer;margin-top:8px;">删除此元素</button>
    `;
  } else if(el.type === 'line') {
    area.innerHTML = `
      <div class="prop-row"><label>X1</label><input type="number" value="${el.x1}" onchange="setProp('x1',+this.value)"></div>
      <div class="prop-row"><label>Y1</label><input type="number" value="${el.y1}" onchange="setProp('y1',+this.value)"></div>
      <div class="prop-row"><label>X2</label><input type="number" value="${el.x2}" onchange="setProp('x2',+this.value)"></div>
      <div class="prop-row"><label>Y2</label><input type="number" value="${el.y2}" onchange="setProp('y2',+this.value)"></div>
      <div class="prop-row"><label>颜色</label><select onchange="setProp('color',+this.value)"><option value="1" ${el.color===1?'selected':''}>白</option><option value="0" ${el.color===0?'selected':''}>黑</option></select></div>
      <button onclick="delElement(${el.id})" style="background:#900;color:#fff;border:none;padding:4px 12px;border-radius:3px;cursor:pointer;margin-top:8px;">删除此元素</button>
    `;
  }
}

// 核心修复函数：通过 selectedId 查找，确保写入 elements 数组
function setProp(key, val) {
  const el = elements.find(e => e.id === selectedId);
  if(!el) return;
  el[key] = val;
  drawCanvas();
  renderList();
  if(key === 'text' || key === 'preview' || key === 'font') renderProps(); // 这些影响预览需要重绘面板
}

function pushVar() {
  const el = elements.find(e => e.id === selectedId);
  if(!el) return;
  el.variables.push('');
  renderProps();
}

function removeVar(idx) {
  const el = elements.find(e => e.id === selectedId);
  if(!el) return;
  el.variables.splice(idx, 1);
  renderProps();
}

function setVar(idx, val) {
  const el = elements.find(e => e.id === selectedId);
  if(!el) return;
  el.variables[idx] = val;
}

function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ============================================================
// 元素列表
// ============================================================
function renderList() {
  const list = document.getElementById('elList');
  list.innerHTML = elements.map(el => {
    const name = el.type==='text' ? `T:"${escHtml((el.preview||el.text||'空').substring(0,8))}"` :
                  el.type==='rect' ? `R:${el.w}×${el.h}` : `L:(${el.x1},${el.y1})`;
    return `<div class="el-item ${el.id===selectedId?'selected':''}" onclick="selectEl(${el.id})">
      <span>${name}</span>
      <button class="el-del" onclick="event.stopPropagation();delElement(${el.id})">×</button>
    </div>`;
  }).join('');
}

function selectEl(id) { selectedId = id; renderProps(); renderList(); drawCanvas(); }

// ============================================================
// 代码生成
// ============================================================
function generateCode() {
  let code = '// 生成于 ' + new Date().toLocaleString() + '\n\n';
  for(const el of elements) {
    if(el.type === 'text') {
      if(el.variables && el.variables.length > 0) {
        code += `sprintf(buff, "${escHtml(el.text)}", ${el.variables.map(v=>v||'0').join(', ')});\n`;
        code += `obdWriteStringCustom(&obd, (GFXfont *)&${el.font}, ${el.x}, ${el.y}, (char *)buff, ${el.color});\n\n`;
      } else {
        code += `obdWriteStringCustom(&obd, (GFXfont *)&${el.font}, ${el.x}, ${el.y}, "${escHtml(el.text)}", ${el.color});\n\n`;
      }
    } else if(el.type === 'rect') {
      code += `obdRectangle(&obd, ${el.x}, ${el.y}, ${el.x+el.w-1}, ${el.y+el.h-1}, ${el.color}, ${el.filled});\n\n`;
    } else if(el.type === 'line') {
      code += `obdDrawLine(&obd, ${el.x1}, ${el.y1}, ${el.x2}, ${el.y2}, ${el.color});\n\n`;
    }
  }
  document.getElementById('codeOut').textContent = code;
}

// ============================================================
// JSON
// ============================================================
function saveJSON() {
  const data = JSON.stringify({elements, nextId}, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'epd_layout.json';
  a.click();
}

function loadJSON() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = function() {
    const reader = new FileReader();
    reader.onload = function() {
      try {
        const data = JSON.parse(reader.result);
        elements = data.elements || [];
        nextId = data.nextId || 1;
        selectedId = null;
        drawCanvas(); renderProps(); renderList(); generateCode();
      } catch(e) { alert('JSON 解析失败: ' + e.message); }
    };
    reader.readAsText(input.files[0]);
  };
  input.click();
}

drawCanvas(); renderList(); generateCode();
</script>

</body>
</html>
